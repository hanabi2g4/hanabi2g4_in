<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>hanabi2g4 的博客</title>
<style>
:root{
  --bg:#0a0a0f;
  --bg-alt:#12121a;
  --text:#f0f0f5;
  --text-soft:#8b8b9e;
  --card:#16161f;
  --card-hover:#1c1c28;
  --border:#252533;
  --primary:#8b5cf6;
  --primary-2:#ec4899;
  --accent:#06b6d4;
  --glow:rgba(139,92,246,0.4);
}
[data-theme="light"]{
  --bg:#f5f5f7;
  --bg-alt:#ffffff;
  --text:#0a0a0f;
  --text-soft:#6b6b7e;
  --card:#ffffff;
  --card-hover:#fafaff;
  --border:#e2e2ea;
  --primary:#7c3aed;
  --primary-2:#db2777;
  --accent:#0891b2;
  --glow:rgba(124,58,237,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  line-height:1.75;
  transition:background .4s,color .4s;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
}
/* 背景光晕 */
body::before{
  content:'';
  position:fixed;
  top:-20%;
  left:-10%;
  width:60vw;
  height:60vw;
  background:radial-gradient(circle,var(--glow),transparent 60%);
  filter:blur(60px);
  z-index:0;
  pointer-events:none;
  animation:float1 20s ease-in-out infinite;
}
body::after{
  content:'';
  position:fixed;
  bottom:-20%;
  right:-10%;
  width:50vw;
  height:50vw;
  background:radial-gradient(circle,rgba(236,72,153,0.25),transparent 60%);
  filter:blur(60px);
  z-index:0;
  pointer-events:none;
  animation:float2 25s ease-in-out infinite;
}
@keyframes float1{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(8%,5%) scale(1.15);}
}
@keyframes float2{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(-6%,-8%) scale(1.1);}
}

/* 顶部导航 */
header{
  position:sticky;
  top:0;
  z-index:100;
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  background:color-mix(in srgb,var(--bg) 70%,transparent);
  border-bottom:1px solid var(--border);
  padding:18px max(20px,calc((100% - 900px)/2));
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:16px;
}
.blog-title{
  font-size:20px;
  font-weight:800;
  letter-spacing:-0.02em;
  background:linear-gradient(135deg,var(--primary),var(--primary-2),var(--accent));
  background-size:200% 200%;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 4s ease infinite;
  display:flex;
  align-items:center;
  gap:8px;
}
.blog-title::before{
  content:'';
  width:10px;
  height:10px;
  border-radius:50%;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  box-shadow:0 0 12px var(--glow);
}
@keyframes shine{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}
nav{display:flex;gap:8px;align-items:center;}
nav a{
  color:var(--text-soft);
  text-decoration:none;
  font-size:14px;
  padding:8px 14px;
  border-radius:10px;
  transition:.25s;
  font-weight:500;
}
nav a:hover{
  color:var(--text);
  background:var(--card);
  transform:translateY(-1px);
}
#themeBtn{
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text-soft);
  padding:8px 12px;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
  transition:.25s;
  display:flex;
  align-items:center;
  gap:6px;
}
#themeBtn:hover{
  color:var(--primary);
  border-color:var(--primary);
  transform:rotate(15deg) scale(1.05);
}

/* 主容器 */
.container{
  max-width:900px;
  margin:0 auto;
  padding:60px 20px 80px;
  position:relative;
  z-index:1;
}

/* Hero 区域 */
.hero{
  text-align:center;
  margin-bottom:70px;
  padding:20px 0;
}
.hero-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  margin:0 auto 24px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:800;
  color:#fff;
  box-shadow:0 0 40px var(--glow),0 0 0 1px rgba(255,255,255,0.1) inset;
  animation:pulse 3s ease-in-out infinite;
  position:relative;
}
.hero-avatar::after{
  content:'';
  position:absolute;
  inset:-6px;
  border-radius:50%;
  border:2px dashed color-mix(in srgb,var(--primary) 40%,transparent);
  animation:spin 20s linear infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 40px var(--glow),0 0 0 1px rgba(255,255,255,0.1) inset;}
  50%{box-shadow:0 0 60px var(--glow),0 0 0 1px rgba(255,255,255,0.2) inset;}
}
@keyframes spin{to{transform:rotate(360deg);}}
.hero h1{
  font-size:44px;
  font-weight:800;
  letter-spacing:-0.03em;
  margin-bottom:12px;
  line-height:1.15;
  background:linear-gradient(135deg,var(--text) 0%,var(--text-soft) 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.hero p{
  color:var(--text-soft);
  font-size:16px;
  margin-bottom:24px;
}
.hero-tags{
  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}
.hero-tags span{
  padding:5px 12px;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--border);
  color:var(--text-soft);
  font-size:13px;
  transition:.2s;
}
.hero-tags span:hover{
  color:var(--primary);
  border-color:var(--primary);
  transform:translateY(-2px);
}

/* 区块标题 */
.section-title{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:700;
  margin-bottom:24px;
  letter-spacing:-0.01em;
}
.section-title::before{
  content:'';
  width:4px;
  height:22px;
  border-radius:2px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2));
}

/* 文章卡片 */
.article-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px 32px;
  margin-bottom:18px;
  cursor:pointer;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  position:relative;
  overflow:hidden;
  animation:fadeUp .5s ease backwards;
}
.article-card::before{
  content:'';
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:2px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2),var(--accent));
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .4s;
}
.article-card::after{
  content:'';
  position:absolute;
  top:50%;
  right:-80px;
  width:160px;
  height:160px;
  border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 70%);
  filter:blur(20px);
  opacity:0;
  transition:opacity .4s;
  transform:translateY(-50%);
  pointer-events:none;
}
.article-card:hover{
  transform:translateY(-4px) scale(1.01);
  background:var(--card-hover);
  border-color:color-mix(in srgb,var(--primary) 50%,var(--border));
  box-shadow:0 20px 40px -20px var(--glow),0 0 0 1px color-mix(in srgb,var(--primary) 30%,transparent);
}
.article-card:hover::before{transform:scaleX(1);}
.article-card:hover::after{opacity:1;}
.article-card h3{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
  letter-spacing:-0.01em;
  transition:color .25s;
  line-height:1.4;
}
.article-card:hover h3{color:var(--primary);}
.article-meta{
  display:flex;
  align-items:center;
  gap:14px;
  font-size:13px;
  color:var(--text-soft);
  margin-bottom:12px;
}
.article-meta span{display:flex;align-items:center;gap:5px;}
.article-summary{
  color:var(--text-soft);
  font-size:14.5px;
  line-height:1.7;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.read-more{
  display:inline-flex;
  align-items:center;
  gap:6px;
  color:var(--primary);
  font-size:14px;
  font-weight:600;
  margin-top:14px;
  transition:gap .25s;
}
.article-card:hover .read-more{gap:10px;}

.article-card:nth-child(1){animation-delay:.05s;}
.article-card:nth-child(2){animation-delay:.1s;}
.article-card:nth-child(3){animation-delay:.15s;}
.article-card:nth-child(4){animation-delay:.2s;}
.article-card:nth-child(5){animation-delay:.25s;}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}

/* 文章详情 */
.back-btn{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 18px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text-soft);
  cursor:pointer;
  font-size:14px;
  margin-bottom:36px;
  transition:.25s;
  text-decoration:none;
  font-weight:500;
}
.back-btn:hover{
  color:var(--primary);
  border-color:var(--primary);
  transform:translateX(-3px);
}
.post-header{
  margin-bottom:44px;
  padding-bottom:28px;
  border-bottom:1px solid var(--border);
  position:relative;
}
.post-header::after{
  content:'';
  position:absolute;
  bottom:-1px;
  left:0;
  width:80px;
  height:2px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2));
}
.post-header h1{
  font-size:38px;
  font-weight:800;
  letter-spacing:-0.03em;
  line-height:1.2;
  margin-bottom:16px;
}
.post-meta{
  color:var(--text-soft);
  font-size:14px;
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}
.post-meta span{display:flex;align-items:center;gap:6px;}

.post-content{
  font-size:16.5px;
  line-height:1.9;
}
.post-content h1,.post-content h2,.post-content h3{
  font-weight:700;
  margin:40px 0 16px;
  letter-spacing:-0.02em;
  line-height:1.35;
  position:relative;
}
.post-content h2{
  font-size:26px;
  padding-left:16px;
}
.post-content h2::before{
  content:'';
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:4px;
  height:70%;
  border-radius:2px;
  background:linear-gradient(180deg,var(--primary),var(--primary-2));
}
.post-content h3{font-size:20px;color:var(--primary);}
.post-content p{margin-bottom:18px;}
.post-content a{
  color:var(--primary);
  text-decoration:none;
  border-bottom:1px solid color-mix(in srgb,var(--primary) 40%,transparent);
  transition:.2s;
}
.post-content a:hover{border-bottom-color:var(--primary);}
.post-content img{
  max-width:100%;
  border-radius:14px;
  margin:20px 0;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.4);
}
.post-content ul,.post-content ol{
  padding-left:26px;
  margin-bottom:18px;
}
.post-content li{margin-bottom:8px;}
.post-content li::marker{color:var(--primary);}
.post-content code{
  background:var(--card);
  color:var(--primary);
  padding:3px 8px;
  border-radius:6px;
  font-size:0.88em;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  border:1px solid var(--border);
}
.post-content pre{
  background:var(--bg-alt);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  overflow-x:auto;
  margin-bottom:20px;
  position:relative;
}
.post-content pre code{background:none;color:var(--text);padding:0;border:none;}
.post-content blockquote{
  border-left:3px solid var(--primary);
  padding:12px 20px;
  color:var(--text-soft);
  margin:20px 0;
  font-style:italic;
  background:var(--card);
  border-radius:0 12px 12px 0;
}
.post-content hr{
  border:none;
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border),transparent);
  margin:36px 0;
}

/* 页脚 */
footer{
  text-align:center;
  padding:48px 20px;
  color:var(--text-soft);
  font-size:13px;
  position:relative;
  z-index:1;
}
footer::before{
  content:'';
  display:block;
  width:60px;
  height:3px;
  background:linear-gradient(90deg,var(--primary),var(--primary-2),var(--accent));
  border-radius:2px;
  margin:0 auto 24px;
}

/* 加载 */
.loading{
  color:var(--text-soft);
  text-align:center;
  padding:80px 0;
  font-size:14px;
}
.loading::after{
  content:'';
  display:block;
  width:32px;
  height:32px;
  margin:20px auto 0;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

/* 空状态 */
.empty{
  text-align:center;
  padding:100px 20px;
  color:var(--text-soft);
}
.empty-icon{
  font-size:64px;
  margin-bottom:20px;
  opacity:.3;
  animation:pulse 3s ease-in-out infinite;
}

/* 响应式 */
@media (max-width:600px){
  header{padding:14px 16px;}
  .blog-title{font-size:16px;}
  .blog-title::before{width:8px;height:8px;}
  nav a{font-size:13px;padding:6px 10px;}
  .container{padding:40px 16px 60px;}
  .hero{margin-bottom:48px;}
  .hero-avatar{width:70px;height:70px;font-size:28px;}
  .hero h1{font-size:30px;}
  .hero p{font-size:14px;}
  .article-card{padding:22px 24px;border-radius:14px;}
  .article-card h3{font-size:17px;}
  .post-header h1{font-size:26px;}
  .post-content{font-size:15.5px;}
  .post-content h2{font-size:22px;}
}
</style>
</head>
<body>
<header>
  <div class="blog-title">hanabi2g4</div>
  <nav>
    <a href="#" onclick="showList();return false;">首页</a>
    <a href="#footer">关于</a>
    <button id="themeBtn">🌙</button>
  </nav>
</header>

<div class="container">
  <div id="list-view"><div class="loading">正在加载文章</div></div>
  <div id="post-view" style="display:none;"></div>
</div>

<footer id="footer">© 2026 hanabi2g4 · 记录每一次思考</footer>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
// 主题切换
const themeBtn = document.getElementById('themeBtn');
// 默认深色，用户可切换
if (localStorage.getItem('blog_theme') === 'light') {
  document.documentElement.setAttribute('data-theme','light');
  themeBtn.textContent = '☀️';
}
themeBtn.onclick = () => {
  if (document.documentElement.getAttribute('data-theme') === 'light') {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('blog_theme','dark');
    themeBtn.textContent = '🌙';
  } else {
    document.documentElement.setAttribute('data-theme','light');
    localStorage.setItem('blog_theme','light');
    themeBtn.textContent = '☀️';
  }
};

// 加载文章列表
let posts = [];
async function loadPosts(){
  try {
    const res = await fetch('posts.json?t=' + Date.now());
    if (res.ok) posts = await res.json();
  } catch(e) {
    console.warn('posts.json 加载失败');
  }
  showList();
}

function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function showList(){
  document.getElementById('post-view').style.display='none';
  document.getElementById('list-view').style.display='block';
  const wrap = document.getElementById('list-view');

  const heroHtml = `
    <div class="hero">
      <div class="hero-avatar">H</div>
      <h1>hanabi</h1>
      <p>唐静</p>
      <div class="hero-tags">
        <span> 随笔</span>
        <span>思考</span>
        <span>成长</span>
      </div>
    </div>
  `;

  if (posts.length === 0) {
    wrap.innerHTML = heroHtml + '<div class="empty"><div class="empty-icon">📭</div><p>还没有文章，去写第一篇吧</p></div>';
    return;
  }

  const sorted = [...posts].sort((a,b) => b.date.localeCompare(a.date));
  wrap.innerHTML = heroHtml + `
    <div class="section-title">最新文章</div>
    ${sorted.map(p => `
      <div class="article-card" onclick="showPost('${p.path}','${escapeHtml(p.title)}','${p.date}')">
        <h3>${escapeHtml(p.title)}</h3>
        <div class="article-meta">
          <span>📅 ${p.date}</span>
        </div>
        ${p.summary ? `<div class="article-summary">${escapeHtml(p.summary)}…</div>` : ''}
        <div class="read-more">阅读全文 →</div>
      </div>
    `).join('')}
  `;
}

async function showPost(path, title, date){
  document.getElementById('list-view').style.display='none';
  const postView = document.getElementById('post-view');
  postView.style.display='block';
  postView.innerHTML = '<div class="loading">加载中</div>';
  try {
    const res = await fetch(path);
    if (!res.ok) throw new Error();
    const md = await res.text();
    const clean = md.replace(/^---[\s\S]*?---\s*/, '');
    const html = marked.parse(clean);
    postView.innerHTML = `
      <button class="back-btn" onclick="showList()">← 返回文章列表</button>
      <div class="post-header">
        <h1>${escapeHtml(title)}</h1>
        <div class="post-meta">
          <span>📅 ${date}</span>
        </div>
      </div>
      <div class="post-content">${html}</div>
    `;
    window.scrollTo(0,0);
  } catch(e){
    postView.innerHTML = `
      <button class="back-btn" onclick="showList()">← 返回文章列表</button>
      <div class="post-header">
        <h1>${escapeHtml(title)}</h1>
        <div class="post-meta"><span>📅 ${date}</span></div>
      </div>
      <p style="color:var(--text-soft)">文章加载失败，请检查文件：${path}</p>
    `;
  }
}

loadPosts();
</script>
</body>
</html>
